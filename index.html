button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.cd.fr.drag{cursor:grabbing;transition:none}
.cd.fr.snap{transition:transform .34s cubic-bezier(.2,1.3,.5,1)}
.cd.fr.fly{transition:transform .3s ease-out,opacity .3s ease-out;opacity:0}
.cd .no{font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-family:var(--body);opacity:.85}
.cd .tk{font-size:clamp(30px,8.6vw,37px);line-height:1.08;font-weight:700;color:var(--ink);margin-top:14px;letter-spacing:-.01em}
.cd .mt{font-size:14px;color:var(--mut);font-family:var(--body);font-weight:500;margin-top:14px;line-height:1.5}
.cd .mini{margin-top:20px;border-top:1px solid var(--cline);font-family:var(--body)}

.cd .dial{margin-top:auto;display:flex;align-items:center;gap:14px}
.cd .dial button{width:46px;height:46px;border:2px solid var(--line);border-radius:15px;color:var(--mut);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}

.cd .dial .rd{font-size:clamp(50px,14vw,64px);font-weight:700;color:var(--ac);line-height:.95;letter-spacing:-.03em;min-width:118px}

#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,90px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:20px;font-size:13.5px;font-weight:600;z-index:80;transition:transform .28s cubic-bezier(.2,1.3,.5,1);max-width:88vw;text-align:center}
#toast.up{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
var KEY="ren.v2", OLD="ren-v1";
var DEF={v:2,t:0,identity:"",habits:[],metric:{name:"",unit:""},pact:{who:"",stake:""},env:[],start:null,cycle:1,days:{},history:[],theme:"auto",tab:"today"};
var S=load(), UI=null, back=[], drag=null;

function load(){
  try{
    var raw=localStorage.getItem(KEY); if(raw) return fix(JSON.parse(raw));
    var o=localStorage.getItem(OLD); if(o) return fix(mig(JSON.parse(o)));
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function fix(o){
  var d=JSON.parse(JSON.stringify(DEF));
  for(var k in d) if(!(k in o)||o[k]==null) o[k]=d[k];
  o.habits=(o.habits||[]).map(function(h){return {id:h.id,name:h.name,icon:h.icon||"flame",color:h.color||"g",mins:h.mins==null?1:h.mins}});
  for(var dk in o.days){var r=o.days[dk];
    if(r.t==null)r.t=[]; if(r.snz==null)r.snz=0; if(r.note==null)r.note="";
    if(r.energy===undefined)r.energy=null; if(r.crisis===undefined)r.crisis=false; if(r.closed===undefined)r.closed=false;}
  o.v=2; return o;
}
function mig(p){
  var o=JSON.parse(JSON.stringify(DEF));
  o.identity=p.identity||"";o.metric=p.metric||{name:"",unit:""};o.pact=p.pact||{who:"",stake:""};
  o.env=p.env||[];o.start=p.start;o.cycle=p.cycle||1;o.history=p.history||[];
  o.habits=(p.habits||[]).map(function(h){return {id:h.id,name:h.name,mins:1}});
  var d=p.days||{};
  for(var k in d){var r=d[k];o.days[k]={t:r.t||[],sleep:r.sleep==null?null:r.sleep,energy:null,m:r.m==null?null:r.m,crisis:!!r.crisis,closed:!!r.closed,note:"",snz:0}}
  return o;
}
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}SY.queue()}
function snapshot(){var c=JSON.parse(JSON.stringify(S));for(var k in c.days){delete c.days[k]._draft;delete c.days[k]._mdraft}return c}

/* ─── đồng bộ Supabase — TUỲ CHỌN, MẶC ĐỊNH TẮT ───────────────────────────────────────
   Ba việc: backup (chữa cái "đổi máy là mất"), mở cùng dữ liệu ở máy khác, và cho GitHub
   Action đọc tiến độ mà soạn tin nhắc Telegram 21h — trình duyệt đóng thì không tự nhắc được.
   MẶC ĐỊNH TẮT vì app này công khai trên GitHub Pages: bật sẵn là đẩy nhật ký của người lạ
   lên máy chủ của Huy mà họ không hề chọn.
   Mã đồng bộ nằm ở khoá localStorage RIÊNG (`ren.sync`), KHÔNG nằm trong state — nhờ vậy file
   .json xuất ra đưa cho ai cũng không kèm chìa khoá vào dữ liệu trên máy chủ.
   Lược đồ + mô hình bảo mật: docs/supabase-setup.sql */
var SB="https://ltmlueqkajqmduoqghdf.supabase.co";
var SBK="sb_publishable_74Lm6cc0CkoOOzy3A4IRrQ_BX0jHQcg";
var SKEY="ren.sync", RE_ID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
var SY={cfg:{id:"",on:false,at:0},timer:null,busy:false,again:false,msg:""};

function uuid4(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  var b=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);
  else for(var j=0;j<16;j++)b[j]=Math.floor(Math.random()*256);
  b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
  var h=[];for(var i=0;i<16;i++)h.push((256+b[i]).toString(16).slice(1));
  return h.slice(0,4).join("")+"-"+h.slice(4,6).join("")+"-"+h.slice(6,8).join("")+"-"+h.slice(8,10).join("")+"-"+h.slice(10).join("");
}
SY.read=function(){try{var o=JSON.parse(localStorage.getItem(SKEY)||"null");
  if(o&&RE_ID.test(o.id||""))SY.cfg={id:o.id,on:!!o.on,at:o.at||0}}catch(e){}};
SY.write=function(){try{localStorage.setItem(SKEY,JSON.stringify(SY.cfg))}catch(e){}};
SY.rpc=function(fn,body,cb){
  if(!window.fetch){cb(new Error("trình duyệt không hỗ trợ"));return}
  fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",keepalive:true,
    headers:{"apikey":SBK,"Authorization":"Bearer "+SBK,"Content-Type":"application/json"},
    body:JSON.stringify(body)})
   .then(function(r){return r.ok?r.json().then(function(j){cb(null,j)})
                              :r.text().then(function(t){cb(new Error(r.status+" "+t.slice(0,120)))})})
   .catch(function(e){cb(e)});
};
/* Chi tiết lỗi ra console, giao diện chỉ nói ngắn: nguyên văn PostgREST là một cục JSON dài,
   nhét vào ô tip thì đẩy hết phần hướng dẫn ra khỏi tầm mắt. */
SY.why=function(e){
  if(window.console&&console.warn)console.warn("[đồng bộ]",e);
  if(navigator.onLine===false)return "đang mất mạng";
  var m=String(e&&e.message||""), code=m.match(/^\d{3}/);
  return code?("máy chủ trả lỗi "+code[0]):"không gọi được máy chủ";
};
SY.done=function(){if(UI==="setup")drawSheet()};
/* Chống dội: mỗi lần quẹt thẻ là một save(); gom 2,5 giây rồi mới đẩy một lần. Đang đẩy dở mà
   có save() mới thì hẹn đẩy lại sau, không bắn song song (hai request đua nhau, cái cũ về sau
   sẽ ghi đè cái mới). */
SY.queue=function(){if(!SY.cfg.on||!SY.cfg.id)return;clearTimeout(SY.timer);SY.timer=setTimeout(SY.push,2500)};
SY.push=function(){
  if(!SY.cfg.on||!SY.cfg.id)return;
  if(SY.busy){SY.again=true;return}
  SY.busy=true;
  SY.rpc("ren_push",{p_device:SY.cfg.id,p_state:snapshot()},function(err){
    SY.busy=false;
    if(err)SY.msg="Chưa đẩy được — "+SY.why(err);
    else{SY.cfg.at=Date.now();SY.write();SY.msg=""}
    if(SY.again){SY.again=false;SY.queue()}else SY.done();
  });
};
/* Kéo bản trên máy chủ về rồi TRỘN, xong đẩy bản đã trộn lên. Chạy lúc mở app và khi bấm
   "Đồng bộ ngay". Không ghi đè thẳng: hai máy cùng dùng một mã thì máy nào mở sau cũng phải
   giữ được công của máy kia. */
SY.boot=function(quiet){
  if(!SY.cfg.on||!SY.cfg.id)return;
  SY.rpc("ren_pull",{p_device:SY.cfg.id},function(err,j){
    if(err){SY.msg="Chưa kéo được — "+SY.why(err);SY.done();return}
    var row=j&&j.length?j[0]:null;
    if(row&&row.state&&row.state.habits){S=mergeState(S,fix(row.state));UI2render()}
    SY.msg="";save();
    if(!quiet)toast(row?"Đã đồng bộ.":"Đã tạo bản trên máy chủ.");
    SY.done();
  });
};
function UI2render(){if(UI)drawSheet();render()}
/* Trộn hai bản. Nguyên tắc: KHÔNG BAO GIỜ xoá công đã ghi — tick hai bên hợp nhất, số đo bên
   nào có thì giữ. Phần cấu hình (việc, căn tính, ngày bắt đầu) lấy bản mới hơn theo `t`,
   TRỪ khi một bên chưa có việc nào: máy mới cài `t` nhảy lên now ngay khi chạm vào giao diện,
   so mốc thời gian thuần sẽ nuốt mất bản thật của máy cũ. */
function mergeState(a,b){
  var an=(a.habits||[]).length, bn=(b.habits||[]).length;
  var bNew=(b.t||0)>(a.t||0);
  var base=(!an&&bn)?b:((!bn&&an)?a:(bNew?b:a));
  var o=JSON.parse(JSON.stringify(base)), keys={}, k;
  o.days={};
  for(k in (a.days||{}))keys[k]=1;
  for(k in (b.days||{}))keys[k]=1;
  for(k in keys)o.days[k]=mergeDay((a.days||{})[k],(b.days||{})[k],bNew);
  o.t=Math.max(a.t||0,b.t||0);
  return fix(o);
}
function mergeDay(x,y,bNew){
  if(!x)return JSON.parse(JSON.stringify(y));
  if(!y)return JSON.parse(JSON.stringify(x));
  var n=JSON.parse(JSON.stringify(bNew?y:x)), old=bNew?x:y, t=(n.t||[]).slice();
  (old.t||[]).forEach(function(id){if(t.indexOf(id)<0)t.push(id)});
  n.t=t;
  ["sleep","m","energy"].forEach(function(f){if(n[f]==null&&old[f]!=null)n[f]=old[f]});
  if(!n.note&&old.note)n.note=old.note;
  n.crisis=!!(n.crisis||old.crisis);
  n.closed=!!(n.closed||old.closed);
  n.snz=Math.max(n.snz||0,old.snz||0);
  delete n._draft;delete n._mdraft;
  return n;
}
SY.line=function(){
  if(SY.msg)return SY.msg+". Sẽ thử lại ở lần lưu sau.";
  if(!SY.cfg.at)return "Chưa đẩy lần nào.";
  var d=new Date(SY.cfg.at), hh=pad(d.getHours())+":"+pad(d.getMinutes());
  return "Đã đẩy lúc "+hh+(dk(d)===today()?" hôm nay":" ngày "+fmtFull(dk(d)))+".";
};
SY.read();
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function dk(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return dk(new Date())}
function P(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function addD(k,n){var d=P(k);return dk(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))}
function diffD(a,b){return Math.round((P(b)-P(a))/864e5)}
function fmtFull(k){var a=k.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function rec(k){return S.days[k]||null}
function ensure(k){if(!S.days[k])S.days[k]={t:[],sleep:null,energy:null,m:null,crisis:false,closed:false,note:"",snz:0};return S.days[k]}
function need(){return S.habits.length}
function got(k){var r=rec(k);if(!r)return 0;return r.t.filter(function(id){return S.habits.some(function(h){return h.id===id})}).length}
function isHit(k){var r=rec(k);if(!r)return false;var n=got(k);return r.crisis?n>=1:(n>0&&n>=need())}
function stat(k){var r=rec(k);if(!r&&k>=today())return"f";if(isHit(k))return (r.crisis&&got(k)<need())?"c":"h";if(got(k)>0)return"p";if(r||k<today())return"m";return"f"}
function streak(){var k=today();if(!isHit(k))k=addD(k,-1);var n=0;while(isHit(k)&&n<4000){n++;k=addD(k,-1)}return n}
function longest(){if(!S.start)return 0;var b=0,c=0,k=S.start,e=today();while(k<=e){if(isHit(k)){c++;if(c>b)b=c}else c=0;k=addD(k,1)}return b}
function hstreak(id){var k=today(),has=function(x){var r=rec(x);return !!(r&&r.t.indexOf(id)>=0)};if(!has(k))k=addD(k,-1);var n=0;while(has(k)&&n<4000){n++;k=addD(k,-1)}return n}
function hrate(id){if(!S.start)return 0;var t=0,h=0,k=S.start,e=today();while(k<=e){t++;var r=rec(k);if(r&&r.t.indexOf(id)>=0)h++;k=addD(k,1)}return t?Math.round(h/t*100):0}
function dayIx(){return S.start?diffD(S.start,today())+1:0}
function snzWeek(){var n=0;for(var i=0;i<7;i++){var r=rec(addD(today(),-i));if(r)n+=r.snz||0}return n}
function sleepAvg(n){var a=[];for(var i=0;i<n;i++){var r=rec(addD(today(),-i));if(r&&r.sleep!=null)a.push(r.sleep)}return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function hitsIn(n){var c=0;for(var i=0;i<n;i++)if(isHit(addD(today(),-i)))c++;return c}
function rateAll(){if(!S.start)return 0;var t=Math.min(diffD(S.start,today())+1,66),h=0;for(var i=0;i<t;i++)if(isHit(addD(S.start,i)))h++;return t?Math.round(h/t*100):0}

function sysNight(){var a=document.documentElement.getAttribute("data-theme");if(a==="dark")return true;if(a==="light")return false;return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches}
function applyTheme(){document.body.classList.toggle("night",S.theme==="dark"||(S.theme==="auto"&&sysNight()))}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("up");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("up")},2700)}
function slow(){return window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches}

/* ─── xếp thẻ cho hôm nay ─── */
function queue(){
  var r=ensure(today()), out=[];
  if(r.sleep==null) out.push({t:"sleep"});
  var pend=S.habits.filter(function(h){return r.t.indexOf(h.id)<0});
  var later=pend.filter(function(h){return back.indexOf(h.id)>=0});
  var now=pend.filter(function(h){return back.indexOf(h.id)<0});
  now.concat(later).forEach(function(h){out.push({t:"task",h:h})});
  if(S.metric.name&&(r.m==null||r.m==="")) out.push({t:"metric"});
  out.push({t:"close"});
  return out;
}

/* ─── mặt thẻ ─── */
function faceTask(h){
  var hs=hstreak(h.id), sw=snzWeek(), r=ensure(today());
  var idx=S.habits.indexOf(h)+1;
  return {
    no:"việc "+idx+" trên "+need(),
    tk:esc(h.name),
    mt:"Mức tối thiểu: "+h.mins+" phút. Làm đúng mức này là tính đủ — ngày khoẻ muốn thêm thì tuỳ.",
    mini:[["chuỗi riêng",hs+" ngày",hs>0?"hot":""],["đã hoãn tuần này",sw+" lần",sw>=3?"bad":(sw>0?"hot":"")]],
    big:h.mins,bigs:" phút",
    left:"Để sau",right:"Xong rồi",
    hint:'quẹt phải khi làm xong · quẹt trái để hoãn'

}

    no:"trước khi bắt đầu",
    tk:"Đêm qua ngủ<br>mấy tiếng?",

    hint:'bấm − và + để chỉnh · quẹt phải để ghi'

function faceMetric(){

  return {
    no:"số đo hôm nay",
    tk:esc(S.metric.name),
    mt:"Ghi một con số để vòng phản hồi chạy — thấy số nhích là động lực tự nạp lại.",
    mini:[["đơn vị",esc(S.metric.unit||"—"),""],["lần ghi gần nhất",lastMetric(),""]],
    num:r._mdraft==null?"":r._mdraft,

    hint:'gõ số rồi quẹt phải'

function lastMetric(){
  for(var i=1;i<=30;i++){var r=rec(addD(today(),-i));if(r&&r.m!=null&&r.m!=="")return r.m+" ("+i+" ngày trước)"}
  return "chưa có";
}
function faceClose(){
  var r=ensure(today()), g=got(today()), n=need(), st=streak(), di=dayIx();
  var full=g>=n, keep=r.crisis&&g>=1;
  return {
    no:"chốt ngày "+Math.min(di,66),
    tk:full?"Đủ việc<br>hôm nay":(keep?"Chuỗi<br>được giữ":(g>0?"Còn "+(n-g)+" việc":"Chưa làm gì")),
    mt:full?"Con người mày đang rèn thắng thêm một ngày. Chốt sổ rồi nghỉ."
        :(keep?"Băng giữ chuỗi đang bật nên một việc là đủ. Mai làm bù."
        :(g>0?"Chốt bây giờ thì chuỗi đứt. Bật băng giữ chuỗi nếu hôm nay mày thật sự đuối."
        :"Chưa có dấu nào. Làm một việc mức tối thiểu thôi cũng hơn là nghỉ.")),
    mini:[["việc hôm nay",g+"/"+n,full?"hot":(g>0?"":"bad")],["chuỗi nếu chốt",(full||keep?st+" ngày":"0 ngày"),(full||keep?"hot":"bad")]],
    big:g,bigs:"/"+n+" việc",
    left:(r.crisis?"Tắt băng":"Băng giữ chuỗi"),right:"Chốt ngày",
    hint:(r.crisis?'băng đang bật · một việc là chuỗi không đứt':'quẹt trái để bật băng giữ chuỗi')
  };
}
function faceDone(){
  var di=dayIx(), st=streak(), r=ensure(today()), g=got(today());
  return {
    no:"xong ngày "+Math.min(di,66),
    tk:"Hết thẻ<br>hôm nay",
    mt:"Sổ đã chốt. Mai app sẽ chia thẻ mới — mở lên là biết phải làm gì, không phải nghĩ.",
    mini:[["chuỗi",st+" ngày",st>0?"hot":"bad"],["ngày của vòng "+S.cycle,Math.min(di,66)+"/66",""]],
    big:st,bigs:" ngày",
    left:"Xem sổ",right:"Mở lại sổ",
    hint:'quay lại mai · hoặc mở sổ xem toàn cảnh'
  };
}
function face(c){
  if(c.t==="task")return faceTask(c.h);
  if(c.t==="sleep")return faceSleep();
  if(c.t==="metric")return faceMetric();
  if(c.t==="close")return faceClose();
  return faceDone();
}

function cardBody(f){

/* ─── quẹt ─── */
function wireDrag(){
  var el=document.getElementById("fr");if(!el)return;
  var yes=el.querySelector(".stamp.sy"), no=el.querySelector(".stamp.sn");
  el.addEventListener("pointerdown",function(e){
    if(e.target.closest("button")||e.target.closest("input"))return;
    drag={x:e.clientX,y:e.clientY,dx:0,id:e.pointerId};
    el.setPointerCapture(e.pointerId);el.classList.add("drag");el.classList.remove("snap");
  });
  el.addEventListener("pointermove",function(e){
    if(!drag||e.pointerId!==drag.id)return;
    drag.dx=e.clientX-drag.x;
    var dy=(e.clientY-drag.y)*0.24;
    el.style.transform="translate("+drag.dx+"px,"+dy+"px) rotate("+(drag.dx/19)+"deg)";
    var p=Math.min(1,Math.abs(drag.dx)/95);
    yes.style.opacity=drag.dx>12?p:0; no.style.opacity=drag.dx<-12?p:0;
  });
  var end=function(e){
    if(!drag)return;
    var dx=drag.dx; drag=null; el.classList.remove("drag");
    if(dx>95){resolve(true,el)} else if(dx<-95){resolve(false,el)}
    else{el.classList.add("snap");el.style.transform="";yes.style.opacity=0;no.style.opacity=0}
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}
function resolve(ok,el){
  if(!el)el=document.getElementById("fr");
  var go=function(){commit(ok)};
  if(el&&!slow()){
    el.classList.remove("snap");el.classList.add("fly");
    el.style.transform="translateX("+(ok?1:-1)*140+"%) rotate("+(ok?16:-16)+"deg)";
    setTimeout(go,260);
  } else go();
}

/* ─── xử lý kết quả ─── */
function commit(ok){
  var r=ensure(today()), q=queue(), c=r.closed?{t:"done"}:q[0];
  if(c.t==="task"){
    if(ok){r.t.push(c.h.id);back=back.filter(function(x){return x!==c.h.id});
      var left=need()-got(today());
      toast(left>0?"Còn "+left+" việc.":"Đủ việc hôm nay.");}
    else{r.snz=(r.snz||0)+1;if(back.indexOf(c.h.id)<0)back.push(c.h.id);toast("Đã hoãn — thẻ này xuống cuối.")}
  }
  else if(c.t==="sleep"){
    if(ok){r.sleep=r._draft==null?7:r._draft;delete r._draft;
      if(r.sleep<6&&!r.crisis){r.crisis=true;toast("Ngủ "+r.sleep+"h — bật băng giữ chuỗi giúp mày.")}
      else toast("Đã ghi "+r.sleep+"h.")}
    else{r.sleep=-1;toast("Bỏ qua giấc ngủ hôm nay.")}
  }
  else if(c.t==="metric"){
    if(ok){var v=r._mdraft;delete r._mdraft;
      if(v==null||String(v).trim()===""){toast("Chưa gõ số nào.");save();render();return}
      r.m=parseFloat(String(v).replace(",","."));toast("Đã ghi "+r.m+" "+(S.metric.unit||""))}
    else{r.m=-1;toast("Bỏ qua số đo.")}
  }
  else if(c.t==="close"){
    if(ok){r.closed=true;toast(isHit(today())?"Chốt ngày — chuỗi "+streak()+" ngày.":"Chốt ngày — chuỗi đứt.")}
    else{r.crisis=!r.crisis;toast(r.crisis?"Băng đã bật — một việc là đủ giữ chuỗi.":"Đã tắt băng.")}
  }
  else{
    if(ok){r.closed=false;toast("Mở lại sổ hôm nay.")}
    else{save();openLedger();return}
  }
  save();render();
}

        +'</div></div>'}).join("")
     +(S.habits.length<4?'<button class="btn gh" data-a="addh">Thêm việc — nhỏ thôi</button>':'')
     +'<div class="tip">Ô nhỏ bên phải là số phút tối thiểu. Để càng nhỏ càng dễ giữ chuỗi.</div></div>'
   +'<div class="blk"><span class="lb">Con số theo dõi</span>'
     +'<div class="fld"><div class="two"><input data-bind="mname" value="'+esc(S.metric.name)+'" placeholder="số trang đọc"><input class="sm" data-bind="munit" value="'+esc(S.metric.unit)+'" placeholder="trang"></div></div></div>'
   +'<div class="blk"><span class="lb">Kèo với người khác</span>'
     +'<div class="fld"><div class="two"><input data-bind="pwho" value="'+esc(S.pact.who)+'" placeholder="ai làm chứng"><input data-bind="pstake" value="'+esc(S.pact.stake)+'" placeholder="trượt thì mất gì"></div></div>'
     +'<button class="btn gh" data-a="report">Copy báo cáo tuần</button></div>'
   +'<div class="blk"><span class="lb">Giao diện</span><div class="chips">'
     +[["auto","Theo hệ thống"],["light","Giấy"],["dark","Đêm"]].map(function(x){
       return '<button class="chip '+(S.theme===x[0]?"on":"")+'" data-a="theme" data-v="'+x[0]+'">'+x[1]+'</button>'}).join("")
   +'</div></div>'
   +'<div class="blk"><span class="lb">Đồng bộ &amp; nhắc Telegram</span>'
     +(SY.cfg.on
       ? '<div class="fld"><div class="two">'
           +'<input value="'+esc(SY.cfg.id)+'" readonly aria-label="mã đồng bộ">'
           +'<button class="ed" data-a="synccopy" style="flex:0 0 auto">Copy mã</button></div></div>'
         +'<button class="btn gh" data-a="syncnow">Đồng bộ ngay</button>'
         +'<button class="btn gh" data-a="syncoff">Tắt đồng bộ</button>'
         +'<button class="btn dg" data-a="syncdel">Tắt và xoá bản trên máy chủ</button>'
         +'<div class="tip">'+esc(SY.line())+' Mã trên là chìa khoá vào dữ liệu — dán vào máy khác để dùng chung, đừng đưa cho ai. Dán mã này vào GitHub Secret <b>REN_DEVICE_ID</b> thì bot Telegram nhắc được lúc 21h.</div>'
       : '<button class="btn gh" data-a="syncon">Bật đồng bộ</button>'
         +'<button class="btn gh" data-a="synclink">Nối vào máy đã có (nhập mã)</button>'
         +'<div class="tip">Đang TẮT — dữ liệu chỉ nằm trong trình duyệt này. Bật thì toàn bộ tiến độ (gồm giấc ngủ và ghi chú) được gửi lên máy chủ riêng: có backup, mở được ở máy khác, và bot Telegram nhắc được mày lúc 21h kể cả khi không mở app.</div>')
   +'</div>'
   +'<div class="blk"><span class="lb">Dữ liệu</span>'
     +'<button class="btn gh" data-a="export">Xuất bản sao .json</button>'
     +'<button class="btn gh" data-a="import">Nhập từ file .json</button>'
     +'<input type="file" id="imp" accept=".json,application/json" hidden>'
     +'<button class="btn dg" data-a="wipe">Xoá sạch, làm lại</button>'
     +'<div class="tip">Dữ liệu nằm trong trình duyệt này và dùng chung với bản Rèn cũ nếu mày từng nhập liệu. '+(SY.cfg.on?'Đã có bản trên máy chủ, nhưng xuất thêm một bản .json vẫn chắc hơn.':'Đổi máy là mất — thỉnh thoảng xuất một bản sao, hoặc bật Đồng bộ ở trên.')+'</div></div>'
   +'<button class="btn" data-a="close">Xong</button>';
}

/* ─── sự kiện ─── */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a, v=b.dataset.v;
  if(a==="yes"){resolve(true);return}
  if(a==="no"){resolve(false);return}
  if(a==="slp"){var r=ensure(today());var cur=r._draft==null?7:r._draft;
    r._draft=Math.max(0,Math.min(14,cur+parseFloat(v)));render();return}
  if(a==="ledger"){openLedger();return}
  if(a==="setup"){openSetup();return}
  if(a==="close"){closeSheet();return}
  if(a==="wnext"){
    wzRead();
    if(WZ.step===0&&!WZ.id){toast("Điền mày đang rèn thành ai đã.");return}
    if(WZ.step===1&&!WZ.habits.filter(Boolean).length){toast("Cần ít nhất một việc.");return}
    if(WZ.step<3){WZ.step++;render();return}
    S.identity=WZ.id;
    S.habits=WZ.habits.map(function(nm,i){return nm?{id:uid(),name:nm,icon:"flame",color:"g",mins:WZ.mins[i]}:null}).filter(Boolean);
    S.metric={name:WZ.mn,unit:WZ.mu};S.start=today();S.cycle=1;
    save();render();toast("Ngày 1 bắt đầu. Quẹt thẻ đầu tiên đi.");return}
  if(a==="wback"){wzRead();WZ.step--;render();return}
  if(a==="newcycle"){S.history.push({cycle:S.cycle,start:S.start,end:today()});S.cycle++;S.start=today();save();drawSheet();toast("Vòng "+S.cycle+" · ngày 1.");return}
  if(a==="addh"){S.habits.push({id:uid(),name:"việc mới",icon:"flame",color:"g",mins:1});save();drawSheet();return}
  if(a==="delh"){S.habits=S.habits.filter(function(h){return h.id!==v});save();drawSheet();return}
  if(a==="theme"){S.theme=v;save();applyTheme();drawSheet();return}
  if(a==="report"){
    var txt="Báo cáo tuần — Rèn\nTao là "+S.identity+".\nTuần này "+hitsIn(7)+"/7 ngày đạt · chuỗi "+streak()+" ngày · hoãn "+snzWeek()+" lần.\nNgày "+Math.min(dayIx(),66)+"/66, vòng "+S.cycle+"."+(S.pact.stake?"\nKèo: trượt tuần thì "+S.pact.stake+".":"");
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast("Đã copy — gửi cho "+(S.pact.who||"người làm chứng")+".")},function(){alert(txt)});
    else alert(txt);
    return}
  if(a==="syncon"){SY.cfg={id:uuid4(),on:true,at:0};SY.write();SY.push();drawSheet();
    toast("Đã bật đồng bộ. Mã hiện ngay bên dưới.");return}
  if(a==="synclink"){
    var m=prompt("Dán mã đồng bộ lấy ở máy cũ (Cài đặt → Đồng bộ → Copy mã):","");
    if(m==null)return;
    m=String(m).trim().toLowerCase();
    if(!RE_ID.test(m)){toast("Mã không đúng dạng — phải là chuỗi uuid 36 ký tự.");return}
    SY.cfg={id:m,on:true,at:0};SY.write();drawSheet();SY.boot();return}
  if(a==="synccopy"){
    if(navigator.clipboard)navigator.clipboard.writeText(SY.cfg.id).then(function(){toast("Đã copy mã đồng bộ.")},function(){alert(SY.cfg.id)});
    else alert(SY.cfg.id);
    return}
  if(a==="syncnow"){toast("Đang đồng bộ…");SY.boot();return}
  if(a==="syncoff"){SY.cfg.on=false;SY.write();drawSheet();
    toast("Đã tắt. Bản trên máy chủ vẫn còn nguyên.");return}
  if(a==="syncdel"){
    if(b.dataset.arm){
      var did=SY.cfg.id;
      SY.cfg={id:"",on:false,at:0};SY.write();drawSheet();
      SY.rpc("ren_forget",{p_device:did},function(err){
        toast(err?"Đã tắt ở máy này, nhưng chưa xoá được trên máy chủ.":"Đã tắt và xoá sạch trên máy chủ.")});
    }else{b.dataset.arm="1";b.textContent="Chắc chưa? Bấm lần nữa là xoá";
      setTimeout(function(){if(b.isConnected){delete b.dataset.arm;b.textContent="Tắt và xoá bản trên máy chủ"}},3000)}
    return}
  if(a==="export"){
    var data=JSON.stringify(snapshot(),null,2), fn="ren-backup-"+today()+".json";
    if(window.claude&&window.claude.downloads)window.claude.downloads.save({filename:fn,data:data})
      .then(function(){toast("Đã lưu bản sao.")},function(err){toast(err&&err.code==="declined"?"Thôi cũng được — nhưng nhớ backup sớm.":"Không lưu được.")});
    else{var bl=new Blob([data],{type:"application/json"}),al=document.createElement("a");al.href=URL.createObjectURL(bl);al.download=fn;al.click();URL.revokeObjectURL(al.href)}
    return}
  if(a==="import"){var f=document.getElementById("imp");if(f)f.click();return}
  if(a==="wipe"){
    if(b.dataset.arm){
      /* Xoá cả bản trên máy chủ, nếu không thì lần mở app sau `mergeState` thấy máy này
         không còn việc nào mà máy chủ còn → lấy nguyên bản cũ về, dữ liệu "sống lại". Giữ
         nguyên mã đồng bộ để bot Telegram vẫn nhắc được vòng mới. */
      if(SY.cfg.on&&SY.cfg.id){clearTimeout(SY.timer);SY.rpc("ren_forget",{p_device:SY.cfg.id},function(){});SY.cfg.at=0;SY.write()}
      localStorage.removeItem(KEY);localStorage.removeItem(OLD);S=JSON.parse(JSON.stringify(DEF));UI=null;drawSheet();render();toast("Sạch. Làm lại từ đầu.")}
    else{b.dataset.arm="1";b.textContent="Chắc chưa? Bấm lần nữa là mất hết";setTimeout(function(){if(b.isConnected){delete b.dataset.arm;b.textContent="Xoá sạch, làm lại"}},3000)}
    return}
});

document.addEventListener("input",function(e){
  var t=e.target, k=t.dataset.bind;if(!k)return;
  if(k==="mdraft"){ensure(today())._mdraft=t.value;return}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="imp"){
    var f=t.files&&t.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{var o=JSON.parse(rd.result);
        if(o&&o.habits&&(o.v===1||o.v===2)){S=fix(o.v===1?mig(o):o);save();UI=null;drawSheet();render();toast("Đã nhập lại dữ liệu.")}
        else toast("File không đúng định dạng của Rèn.")}
      catch(err){toast("Không đọc được file.")}};
    rd.readAsText(f);t.value="";return}
  var k=t.dataset.bind;if(!k)return;
  var val=t.value;
  if(k==="identity"&&val.trim())S.identity=val.trim();
  if(k==="hname"){var h=S.habits.filter(function(x){return x.id===t.dataset.id})[0];if(h&&val.trim())h.name=val.trim()}
  if(k==="hmins"){var h2=S.habits.filter(function(x){return x.id===t.dataset.id})[0];var m=parseInt(val,10);if(h2)h2.mins=isNaN(m)||m<1?1:m}
  if(k==="mname")S.metric.name=val.trim();
  if(k==="munit")S.metric.unit=val.trim();
  if(k==="pwho")S.pact.who=val.trim();
  if(k==="pstake")S.pact.stake=val.trim();
  save();
});
document.addEventListener("keydown",function(e){
  if(UI&&e.key==="Escape"){closeSheet();return}
  if(UI||document.activeElement&&document.activeElement.tagName==="INPUT")return;
  if(!S.start||!S.habits.length)return;
  if(e.key==="ArrowRight"){e.preventDefault();resolve(true)}
  if(e.key==="ArrowLeft"){e.preventDefault();resolve(false)}
});
if(window.matchMedia){var mq=window.matchMedia("(prefers-color-scheme:dark)");
  if(mq.addEventListener)mq.addEventListener("change",function(){if(S.theme==="auto"){applyTheme();if(UI)drawSheet()}})}
new MutationObserver(function(){if(S.theme==="auto")applyTheme()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
render();
/* Kéo–trộn–đẩy lúc mở app; đẩy nốt khi rời trang (đang chờ 2,5 giây mà đóng tab là mất);
   thử lại khi có mạng trở lại. `quiet` để không nhả toast mỗi lần mở app. */
SY.boot(true);
addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"&&SY.cfg.on&&SY.cfg.id){clearTimeout(SY.timer);SY.push()}});
addEventListener("online",function(){if(SY.msg)SY.queue()});
</script>
<script>
if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
